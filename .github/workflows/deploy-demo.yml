name: Deploy demo to GitHub Pages

# Builds the Vite demo under docx-editor/examples/vite and publishes the
# static output to GitHub Pages at https://CasualOffice.github.io/docs/.
# Repo settings → Pages → Source must be "GitHub Actions" for this to land.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: docx-editor

jobs:
  build:
    name: Build Vite demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # @schnsrw/design-system tokens are a submodule under
          # docx-editor/vendor/design-system; the CSS build needs them.
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install
        # Retry to survive transient npm registry tarball flakes
        # (e.g. sharp's optional platform binary failing to download).
        run: |
          for i in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "::warning::bun install attempt $i failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Build core + react libs
        run: bun run build

      # Setup Pages BEFORE the demo build: `configure-pages` reports the
      # site's base path, which Vite needs at build time.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Base path: '' for a custom domain / user site (served at '/'),
      # '/<repo>' for a project site like <user>.github.io/<repo>/. Vite's
      # default base of '/' would 404 every asset on a project site.
      - name: Build demo (Vite)
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: bun run build:demo

      # Only pin a custom domain when the repo asks for one. Hardcoding it
      # made a fork claim an upstream domain and break its own github.io
      # site. Set the repository variable PAGES_CUSTOM_DOMAIN to opt in.
      - name: Write CNAME for custom domain
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: echo '${{ vars.PAGES_CUSTOM_DOMAIN }}' > examples/vite/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docx-editor/examples/vite/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
